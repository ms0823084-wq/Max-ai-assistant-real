name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: |
          unzip -q max-assistant-fixed.zip -d proj
          cd proj
          gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/*.apk max-assistant.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest max-assistant.apk --title "Max Assistant APK" --notes "Latest debug build"
